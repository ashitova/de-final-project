version: "3.8"

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"
      - "9500:9500"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./init-scripts/init_clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
      - ./config/custom-config.xml:/etc/clickhouse-server/config.d/custom-config.xml
    environment:
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_USER: username
      CLICKHOUSE_PASSWORD: password
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 8G
        reservations:
          memory: 4G
    

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"  # MinIO API Port
      - "9001:9001"  # MinIO Web Console Port
    environment:
      MINIO_ROOT_USER: myaccesskey
      MINIO_ROOT_PASSWORD: mysecretkey
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: unless-stopped


  postgres:
    image: postgres:16-bookworm
    container_name: postgresql-dba
    hostname: pg16

    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      PSQLRC: /var/lib/postgresql/data/.psqlrc
      PSQL_HISTORY: /var/lib/postgresql/data/.psql_history

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init.sql


volumes:
  clickhouse_data:
  minio_data:
    driver: local
  pgdata: